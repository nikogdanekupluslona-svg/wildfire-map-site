    <!-- get-the-app block; source of truth: seo-workspace/homepage-patch/app-cta.html -->
    <style>
    .app-cta{position:fixed;top:52px;right:14px;z-index:1002;display:flex;align-items:center;gap:8px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app-cta a{text-decoration:none}
    .app-cta__btn{display:inline-flex;align-items:center;white-space:nowrap;background:#fff;color:#b91c1c;font-weight:700;font-size:13px;line-height:1.2;padding:8px 13px;border-radius:8px;box-shadow:0 1px 3px rgba(15,23,42,.2)}
    .app-cta__btn:hover{background:#fee2e2}
    .app-cta__badge{display:inline-flex;line-height:0}
    .app-cta__badge img{display:block;width:auto;height:32px}
    .app-cta__qr{position:relative;display:inline-flex;line-height:0}
    .app-cta__qr>img{display:block;width:38px;height:38px;padding:2px;background:#fff;border-radius:7px}
    .app-cta__pop{position:absolute;top:calc(100% + 10px);right:0;display:none;padding:12px;background:#fff;border-radius:12px;box-shadow:0 14px 32px rgba(15,23,42,.28);text-align:center}
    .app-cta__qr:hover .app-cta__pop,.app-cta__qr:focus .app-cta__pop,.app-cta__qr:focus-visible .app-cta__pop{display:block}
    .app-cta__pop img{display:block;width:150px;height:150px}
    .app-cta__pop b{display:block;margin-top:9px;font-size:12px;color:#1f2937;white-space:nowrap}
    .app-cta a:focus-visible{outline:2px solid #fff;outline-offset:2px}
    @media (max-width:1299px){.app-cta__qr{display:none}}
    @media (max-width:1199px){.app-cta__badge{display:none}}
    @media (max-width:999px){.app-cta{display:none}}
    body:has(.header--collapsed) .app-cta{display:none}
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div class="app-cta">

      <a class="app-cta__badge" href="https://apps.apple.com/app/apple-store/id6785946092?pt=118858502&amp;ct=Home&amp;mt=8" rel="noopener"><img src="/blog/assets/badge-app-store.svg" width="120" height="40" alt="Download US Wildfire Tracker on the App Store"></a>
      <a class="app-cta__qr" href="https://apps.apple.com/app/apple-store/id6785946092?pt=118858502&amp;ct=Home_QR&amp;mt=8" rel="noopener" aria-label="Scan or open to install the US Wildfire Tracker iPhone app"><img src="/blog/assets/qr-app-store-home.svg" width="38" height="38" alt="QR code linking to the US Wildfire Tracker app on the App Store"><span class="app-cta__pop"><img src="/blog/assets/qr-app-store-home.svg" width="150" height="150" alt=""><b>Scan to install on iPhone</b></span></a>
    </div>
